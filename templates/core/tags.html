{% extends "base.html" %}

{% block content %}
  <h1>
    Tags
    <a href="{% url 'core:tags-create' %}" class="btn btn-primary link-to-page ">
      Create
    </a>
  </h1>
  <table class="table">
    <thead class="thead-light">
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tag_list %}
      <tr>
        <td>{{ tag.name }}</td>
        <td><a href="{% url 'core:tags-update' pk=tag.id %}">Update</a></td>
        <td><a href="{% url 'core:tags-delete' pk=tag.id %}">Delete</a></td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
